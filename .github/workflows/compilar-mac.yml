name: Compilar ayuda-colegio (Mac)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest   # Mac con chip Apple Silicon (M1 o posterior)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller -r requirements.txt
      - run: pyinstaller --noconfirm --windowed --name ayuda-colegio app.py
      - run: codesign --force --deep --sign - dist/ayuda-colegio.app
      # ditto conserva los permisos de la app dentro del .zip
      - run: ditto -c -k --keepParent dist/ayuda-colegio.app ayuda-colegio-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ayuda-colegio-Mac
          path: ayuda-colegio-Mac.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ayuda-colegio-Mac.zip \
            --title "ayuda-colegio $GITHUB_REF_NAME" \
            --notes "Descarga el .zip, ábrelo y usa la app. Primera vez: clic derecho sobre la app > Abrir. En macOS 15 (Sequoia) o posterior, si no basta: Ajustes del Sistema > Privacidad y seguridad > Abrir de todos modos."
